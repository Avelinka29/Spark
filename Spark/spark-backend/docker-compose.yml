name: spark-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spark
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    ports:
      - "5432:5432"
    volumes:
      - spark_postgres_data:/var/lib/postgresql/data
      - ./sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://spark:spark@postgres:5432/spark
      JWT_SECRET: local-development-secret-replace-in-production
      ACCESS_TOKEN_MINUTES: 30
      GOOGLE_WEB_CLIENT_ID: 1089503089556-asefglffks4sun71ho9sgd9ehrclsn88.apps.googleusercontent.com
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      ALLOW_DEVELOPMENT_CODES: ${ALLOW_DEVELOPMENT_CODES:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spark_postgres_data:
    external: true
    name: backend_spark_postgres_data
